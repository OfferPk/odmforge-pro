<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#111d33"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16243b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  
  <text x="480" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="1">ODMFORGE PRO (v1.0.0) — SYSTEM ARCHITECTURE</text>
  <text x="480" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">CCSDS 502.0-B-3 &amp; ISO 26900 Orbit Data Messages Flight Dynamics &amp; Ephemeris Studio</text>
  
  <!-- Left Box: Ingestion & Models -->
  <rect x="40" y="110" width="260" height="360" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="40" y="110" width="260" height="40" rx="10" fill="#1e293b"/>
  <text x="170" y="136" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ORBITAL INGESTION</text>
  <text x="60" y="180" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Cartesian State Vectors</text>
  <text x="75" y="202" fill="#64748b" font-family="monospace" font-size="11">[X, Y, Z, X_DOT, Y_DOT, Z_DOT]</text>
  <text x="60" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Keplerian Classical Elements</text>
  <text x="75" y="262" fill="#64748b" font-family="monospace" font-size="11">[a, e, i, RAAN, ArgP, Nu]</text>
  <text x="60" y="300" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Mission Profile Presets</text>
  <text x="75" y="322" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">ISS (LEO), Landsat (SSO), Molniya</text>
  <text x="60" y="360" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Frame &amp; Epoch Config</text>
  <text x="75" y="382" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">GCRF, EME2000, ITRF (UTC/TDB)</text>

  <!-- Middle Box: Core Engines -->
  <rect x="350" y="110" width="260" height="360" rx="10" fill="url(#cardBg)" stroke="#0284c7" stroke-width="2"/>
  <rect x="350" y="110" width="260" height="40" rx="10" fill="#0284c7"/>
  <text x="480" y="136" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ASTRODYNAMICS ENGINES</text>
  <text x="370" y="180" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">1. State Conversion Engine</text>
  <text x="385" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Angular momentum vector h = r x v</text>
  <text x="385" y="220" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Eccentricity e = ((v^2-mu/r)r-(r.v)v)/mu</text>
  <text x="370" y="260" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">2. ODM Generator (KVN/XML)</text>
  <text x="385" y="282" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">OPM (Osculating Parameter Msg)</text>
  <text x="385" y="300" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">OEM (Ephemeris Msg w/ Interp)</text>
  <text x="385" y="318" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">OMM (Mean-Elements / SGP4)</text>
  <text x="370" y="358" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">3. 10-Point Normative Auditor</text>
  <text x="385" y="380" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">CCSDS 502.0-B-3 Rules 001 - 010</text>
  <text x="385" y="398" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">Automated Pass/Fail Compliance</text>

  <!-- Right Box: Mission Outputs & Integration -->
  <rect x="660" y="110" width="260" height="360" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="660" y="110" width="260" height="40" rx="10" fill="#1e293b"/>
  <text x="790" y="136" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MISSION PRODUCTS</text>
  <text x="680" y="180" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Conforming KVN Output</text>
  <text x="695" y="202" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Validated Blue Book OPM/OEM/OMM</text>
  <text x="680" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Ephemeris Interpolation</text>
  <text x="695" y="262" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Lagrange Polynomial Degree 5-9</text>
  <text x="680" y="300" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Python CLI Utility</text>
  <text x="695" y="322" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Headless CI/CD Pipeline Ready</text>
  <text x="680" y="360" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Compliance Verification Report</text>
  <text x="695" y="382" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">100% Scorecard for Ground Networks</text>

  <!-- Connectors -->
  <line x1="300" y1="290" x2="350" y2="290" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="290" x2="660" y2="290" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
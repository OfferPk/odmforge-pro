<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#0b1324"/>
  <!-- Header Bar -->
  <rect x="0" y="0" width="960" height="50" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="30" cy="25" r="8" fill="#38bdf8"/>
  <text x="50" y="31" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">ODMForge Pro</text>
  <text x="165" y="31" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">v1.0.0</text>
  <text x="220" y="31" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">CCSDS 502.0-B-3 &amp; ISO 26900 Flight Dynamics Studio</text>
  <rect x="840" y="12" width="95" height="26" rx="4" fill="#059669"/>
  <text x="887" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">10/10 PASS</text>

  <!-- Left Column: Input Form -->
  <rect x="20" y="70" width="340" height="445" rx="8" fill="#131f37" stroke="#1e293b" stroke-width="1"/>
  <text x="35" y="100" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">MISSION PARAMETERS</text>
  <rect x="35" y="115" width="65" height="22" rx="4" fill="#0284c7"/><text x="67" y="130" fill="#fff" font-size="10" font-family="sans-serif" text-anchor="middle">ISS (LEO)</text>
  <rect x="105" y="115" width="75" height="22" rx="4" fill="#1e293b"/><text x="142" y="130" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">LANDSAT</text>
  <rect x="185" y="115" width="65" height="22" rx="4" fill="#1e293b"/><text x="217" y="130" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">MOLNIYA</text>
  <rect x="255" y="115" width="55" height="22" rx="4" fill="#1e293b"/><text x="282" y="130" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">GEO</text>

  <text x="35" y="160" fill="#94a3b8" font-size="11" font-family="sans-serif">Position Vector [X, Y, Z] km</text>
  <rect x="35" y="170" width="310" height="26" rx="4" fill="#0b1324" stroke="#334155"/>
  <text x="45" y="187" fill="#f8fafc" font-family="monospace" font-size="11">6780.000, 0.000, 0.000</text>

  <text x="35" y="220" fill="#94a3b8" font-size="11" font-family="sans-serif">Velocity Vector [Vx, Vy, Vz] km/s</text>
  <rect x="35" y="230" width="310" height="26" rx="4" fill="#0b1324" stroke="#334155"/>
  <text x="45" y="247" fill="#f8fafc" font-family="monospace" font-size="11">0.000, 5.430, 5.430</text>

  <text x="35" y="280" fill="#94a3b8" font-size="11" font-family="sans-serif">Computed Semi-Major Axis (a)</text>
  <text x="35" y="300" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">6,780.12 km</text>

  <text x="200" y="280" fill="#94a3b8" font-size="11" font-family="sans-serif">Computed Eccentricity (e)</text>
  <text x="200" y="300" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">0.000540</text>

  <text x="35" y="335" fill="#94a3b8" font-size="11" font-family="sans-serif">Inclination (i)</text>
  <text x="35" y="355" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">51.64°</text>

  <text x="200" y="335" fill="#94a3b8" font-size="11" font-family="sans-serif">Orbital Period (T)</text>
  <text x="200" y="355" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">92.45 min</text>

  <!-- Right Top: KVN Output Console -->
  <rect x="380" y="70" width="555" height="280" rx="8" fill="#070d18" stroke="#1e293b" stroke-width="1"/>
  <text x="400" y="95" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">CCSDS 502.0-B-3 OPM (KVN CONSOLE)</text>
  <text x="400" y="120" fill="#64748b" font-family="monospace" font-size="11">CCSDS_OPM_VERS = 2.0</text>
  <text x="400" y="136" fill="#64748b" font-family="monospace" font-size="11">CREATION_DATE  = 2026-10-16T11:23:45.000Z</text>
  <text x="400" y="152" fill="#64748b" font-family="monospace" font-size="11">ORIGINATOR     = ODMFORGE_STUDIO</text>
  <text x="400" y="172" fill="#38bdf8" font-family="monospace" font-size="11">OBJECT_NAME    = ISS (ZARYA)</text>
  <text x="400" y="188" fill="#38bdf8" font-family="monospace" font-size="11">OBJECT_ID      = 1998-067A</text>
  <text x="400" y="204" fill="#38bdf8" font-family="monospace" font-size="11">REF_FRAME      = GCRF</text>
  <text x="400" y="224" fill="#a5b4fc" font-family="monospace" font-size="11">X              = 6780.000000 [km]</text>
  <text x="400" y="240" fill="#a5b4fc" font-family="monospace" font-size="11">Y_DOT          = 5.430000 [km/s]</text>
  <text x="400" y="256" fill="#a5b4fc" font-family="monospace" font-size="11">Z_DOT          = 5.430000 [km/s]</text>
  <text x="400" y="276" fill="#34d399" font-family="monospace" font-size="11">SEMI_MAJOR_AXIS= 6780.120000 [km]</text>
  <text x="400" y="292" fill="#34d399" font-family="monospace" font-size="11">ECCENTRICITY   = 0.00054000</text>
  <text x="400" y="308" fill="#34d399" font-family="monospace" font-size="11">INCLINATION    = 51.640000 [deg]</text>

  <!-- Right Bottom: 10-Point Normative Audit Status -->
  <rect x="380" y="365" width="555" height="150" rx="8" fill="#131f37" stroke="#1e293b" stroke-width="1"/>
  <text x="400" y="390" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">NORMATIVE COMPLIANCE SCORECARD</text>
  <text x="400" y="412" fill="#34d399" font-family="sans-serif" font-size="11">[PASS] ODM-001: CCSDS Version 2.0</text>
  <text x="400" y="430" fill="#34d399" font-family="sans-serif" font-size="11">[PASS] ODM-002: Metadata Mandatory Keys</text>
  <text x="400" y="448" fill="#34d399" font-family="sans-serif" font-size="11">[PASS] ODM-003: Coordinate Reference Frame (GCRF)</text>
  <text x="400" y="466" fill="#34d399" font-family="sans-serif" font-size="11">[PASS] ODM-004: ISO 8601 UTC Epoch</text>
  <text x="400" y="484" fill="#34d399" font-family="sans-serif" font-size="11">[PASS] ODM-005: Physical State Vector Bounds</text>

  <text x="680" y="412" fill="#34d399" font-family="sans-serif" font-size="11">[PASS] ODM-006: Semi-Major Axis Realism</text>
  <text x="680" y="430" fill="#34d399" font-family="sans-serif" font-size="11">[PASS] ODM-007: Eccentricity Domain [0, 1)</text>
  <text x="680" y="448" fill="#34d399" font-family="sans-serif" font-size="11">[PASS] ODM-008: Angular Elements Domains</text>
  <text x="680" y="466" fill="#34d399" font-family="sans-serif" font-size="11">[PASS] ODM-009: Spacecraft Mass/Aero Bounds</text>
  <text x="680" y="484" fill="#34d399" font-family="sans-serif" font-size="11">[PASS] ODM-010: Strict KVN Line Syntax</text>
</svg>